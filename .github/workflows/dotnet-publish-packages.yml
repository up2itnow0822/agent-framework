name: dotnet-publish-packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: dotnet/global.json

      - name: Build (generates .nupkg via GeneratePackageOnBuild)
        working-directory: dotnet
        run: dotnet build agent-framework-dotnet.slnx -c Release

      - name: Push to GitHub Packages
        working-directory: dotnet
        run: |
          find src -name "*.nupkg" -not -name "*.symbols.nupkg" -print0 | \
            xargs -0 -I {} dotnet nuget push {} \
              --source "https://nuget.pkg.github.com/microsoft/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
